[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "reqtrace-cli"
version = "0.0.1"
authors = [
  { name="Daniel Williams", email="willd182@my.erau.com" },
]
description = "A CLI tool to parse REQUIREMENTS.md files into requirements traceability reports."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/daiawi/reqtrace-cli"
Issues = "https://github.com/daiawi/reqtrace-cli/issues"